# Render Blueprint – free tier, no persistent disk.
# Deploy: https://dashboard.render.com → New → Blueprint → choose this repository.
services:
  - type: web
    name: michtavim-larebbe
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # explanation and analysis (on request): Gemini by default, Claude as an alternative
      - key: GEMINI_API_KEY
        sync: false # from https://aistudio.google.com/apikey – entered in the Render dashboard, never committed
      - key: AI_RATE_PER_HOUR
        value: "40"
      - key: ANTHROPIC_API_KEY
        sync: false # optional
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_EFFORT
        value: medium
      # WhatsApp (optional) – fill in the dashboard when ready
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
