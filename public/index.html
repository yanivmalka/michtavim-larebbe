<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1f3a5f">
  <title>מכתבים לרבי</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <button id="back" class="icon-btn back" title="חזרה" aria-label="חזרה" hidden>→</button>
      <img src="icon.svg" alt="" class="avatar">
      <div class="title">
        <h1 id="title-text">מכתבים לרבי</h1>
        <span class="sub" id="status">מענה מתוך אגרות הקודש</span>
      </div>
      <button id="chat-menu" class="icon-btn chat-only" title="אפשרויות השיחה" aria-label="אפשרויות השיחה">⋮</button>
    </header>

    <div id="search-bar" class="search-bar">
      <input id="search" type="search" placeholder="🔍 חיפוש שיחות" aria-label="חיפוש שיחות">
    </div>

    <div id="update-banner" class="update-banner" hidden>
      <span id="update-text"></span>
      <button type="button" id="update-now">עדכון</button>
    </div>

    <main id="chat" class="chat" aria-live="polite">
    </main>

    <dialog id="settings" class="settings">
      <form method="dialog">
        <h2>הגדרות</h2>
        <div id="server-section">
          <label>כתובת השרת
            <input id="server-input" type="url" placeholder="https://example.com" dir="ltr">
          </label>
          <button type="button" id="server-save">שמירה</button>
          <hr>
        </div>
        <div class="version-row">
          <span>גרסת האפליקציה: <b id="app-version" dir="ltr">–</b></span>
        </div>
        <label class="check"><input type="checkbox" id="auto-check" checked> בדיקת עדכונים אוטומטית בפתיחה</label>
        <button type="button" id="check-update">בדיקת עדכונים</button>
        <p id="update-status" class="status" aria-live="polite"></p>
        <button type="button" id="install-update" hidden>הורדה והתקנה</button>
        <progress id="update-progress" max="100" value="0" hidden></progress>
        <div class="dialog-actions"><button value="close">סגירה</button></div>
      </form>
    </dialog>

    <div id="hl-bar" class="hl-bar" hidden>
      <button type="button" id="hl-add" hidden>🖍 הדגשת הטקסט המסומן</button>
      <button type="button" id="hl-mode">🖍 מצב מרקר</button>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button type="button" id="lightbox-close" aria-label="סגירה">✕</button>
      <div class="lightbox-scroll"><img id="lightbox-img" alt=""></div>
      <div class="lightbox-nav" id="lightbox-nav">
        <button type="button" id="lb-prev" title="העמוד הקודם" aria-label="העמוד הקודם">→</button>
        <span id="lb-where"></span>
        <button type="button" id="lb-next" title="העמוד הבא" aria-label="העמוד הבא">←</button>
      </div>
      <button type="button" id="lightbox-close-bottom" class="lightbox-close-bottom">✕ סגירה</button>
    </div>

    <button type="button" id="new-chat" class="fab" title="מכתב חדש" aria-label="מכתב חדש">✎</button>

    <dialog id="conv-menu" class="settings conv-menu">
      <form method="dialog">
        <h2 id="menu-title"></h2>
<label class="lang-row">
        <span>שפת המענה</span>
        <select id="lang" aria-label="שפת המענה">
          <option value="">שפת המכתב</option>
          <option value="he">עברית</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
        </select>
      </label>
        <button type="button" id="menu-rename">✎ שינוי שם</button>
        <button type="button" id="menu-archive">🗄 העברה לארכיון</button>
        <button type="button" id="menu-lock">🔒 נעילת השיחה</button>
        <button type="button" id="menu-delete" class="danger">🗑 מחיקת השיחה</button>
        <div class="dialog-actions"><button value="close">ביטול</button></div>
      </form>
    </dialog>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="כתבו את המכתב…" maxlength="8000" required></textarea>
      <button type="submit" id="send" class="send" aria-label="שליחה">➤</button>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
