<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1f3a5f">
  <title>מכתבים לרבי</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <button id="back" class="icon-btn back" title="חזרה" aria-label="חזרה" hidden>→</button>
      <img src="icon.svg" alt="" class="avatar">
      <div class="title">
        <h1 id="title-text">מכתבים לרבי</h1>
        <span class="sub" id="status">מענה מתוך אגרות הקודש</span>
      </div>
      <button id="home-menu" class="icon-btn list-only" title="תפריט" aria-label="תפריט">⋮</button>
      <button id="collapse-all" class="icon-btn chat-only" title="מזעור כל ההתכתבויות" aria-label="מזעור כל ההתכתבויות" hidden>⊟</button>
      <button id="chat-menu" class="icon-btn chat-only" title="אפשרויות השיחה" aria-label="אפשרויות השיחה">⋮</button>
    </header>

    <!-- selection mode (long press on a letter, an answer, a message or a chat) -->
    <header id="sel-bar" class="bar sel-bar" hidden>
      <button type="button" id="sel-close" class="icon-btn" title="ביטול הבחירה" aria-label="ביטול הבחירה">✕</button>
      <div class="title"><h1 id="sel-count">1</h1></div>
      <button type="button" id="sel-archive" class="icon-btn" title="העברה לארכיון" aria-label="העברה לארכיון">🗄</button>
      <button type="button" id="sel-lock" class="icon-btn" title="נעילה" aria-label="נעילה">🔒</button>
      <button type="button" id="sel-read" class="icon-btn" title="סימון כנקרא" aria-label="סימון כנקרא">✓</button>
      <button type="button" id="sel-copy" class="icon-btn" title="העתקה" aria-label="העתקה">📋</button>
      <button type="button" id="sel-move" class="icon-btn" title="העברה לשיחה אחרת" aria-label="העברה לשיחה אחרת">➦</button>
      <button type="button" id="sel-delete" class="icon-btn" title="גניזה" aria-label="גניזה">🗑</button>
      <button type="button" id="sel-more" class="icon-btn" title="עוד" aria-label="עוד">⋮</button>
    </header>

    <!-- the standard drop-down menu (⋮) -->
    <div id="menu-backdrop" class="menu-backdrop" hidden></div>
    <div id="menu" class="menu" role="menu" hidden></div>

    <div id="search-bar" class="search-bar">
      <input id="search" type="search" placeholder="🔍 חיפוש שיחות" aria-label="חיפוש שיחות">
    </div>

    <div id="update-banner" class="update-banner" hidden>
      <span id="update-text"></span>
      <button type="button" id="update-now">עדכון</button>
    </div>

    <main id="chat" class="chat" aria-live="polite">
    </main>

    <dialog id="settings" class="settings">
      <form method="dialog">
        <h2>הגדרות</h2>
        <div id="server-section">
          <label>כתובת השרת
            <input id="server-input" type="url" placeholder="https://example.com" dir="ltr">
          </label>
          <button type="button" id="server-save">שמירה</button>
          <hr>
        </div>
        <div class="version-row">
          <span>גרסת האפליקציה: <b id="app-version" dir="ltr">–</b></span>
        </div>
        <label class="check"><input type="checkbox" id="auto-check" checked> בדיקת עדכונים אוטומטית בפתיחה</label>
        <button type="button" id="check-update">בדיקת עדכונים</button>
        <p id="update-status" class="status" aria-live="polite"></p>
        <button type="button" id="install-update" hidden>הורדה והתקנה</button>
        <progress id="update-progress" max="100" value="0" hidden></progress>
        <p id="update-detail" class="note" dir="auto"></p>
        <a id="manual-update" class="link-btn" target="_blank" rel="noopener" hidden>⬇ הורדה ידנית מהדפדפן</a>
        <div class="dialog-actions"><button value="close">סגירה</button></div>
      </form>
    </dialog>

    <div id="hl-bar" class="hl-bar" hidden>
      <button type="button" id="hl-add" hidden>🖍 הדגשת הטקסט המסומן</button>
      <button type="button" id="hl-mode">🖍 מצב מרקר</button>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button type="button" id="lightbox-close" aria-label="סגירה">✕</button>
      <div class="lightbox-scroll"><img id="lightbox-img" alt=""></div>
      <div class="lightbox-nav" id="lightbox-nav">
        <button type="button" id="lb-prev" title="העמוד הקודם" aria-label="העמוד הקודם">→</button>
        <span id="lb-where"></span>
        <button type="button" id="lb-next" title="העמוד הבא" aria-label="העמוד הבא">←</button>
      </div>
      <button type="button" id="lightbox-close-bottom" class="lightbox-close-bottom">✕ סגירה</button>
    </div>

    <button type="button" id="new-chat" class="fab" title="מכתב חדש" aria-label="מכתב חדש">✎</button>

    <dialog id="move-dialog" class="settings conv-menu">
      <form method="dialog">
        <h2>העברה לשיחה</h2>
        <div id="move-list" class="move-list"></div>
        <div class="dialog-actions"><button value="close">ביטול</button></div>
      </form>
    </dialog>

    <!-- text size (pinch on the letter / analysis, or the Aa button) -->
    <div id="zoom-bar" class="zoom-bar" hidden>
      <button type="button" id="zoom-minus" aria-label="הקטנת הטקסט">−</button>
      <input type="range" id="zoom-range" min="70" max="200" step="5" value="100" aria-label="גודל הטקסט">
      <button type="button" id="zoom-plus" aria-label="הגדלת הטקסט">+</button>
      <span id="zoom-pct" dir="ltr">100%</span>
    </div>

    <!-- expansion of abbreviations (ראשי תיבות), on tap -->
    <div id="rt-pop" class="rt-pop" role="dialog" hidden></div>

    <dialog id="account" class="settings">
      <form method="dialog">
        <h2>חשבון</h2>
        <div id="account-out">
          <p>התחברות עם חשבון Google מסנכרנת את השיחות בין המכשירים ומאפשרת לשתף שיחות עם אנשי קשר.</p>
          <button type="button" id="sign-in">התחברות עם Google</button>
        </div>
        <div id="account-in" hidden>
          <p>מחובר: <b id="account-name"></b></p>
          <p class="note">השיחות נשמרות בחשבון. מועדפים, הדגשות, ארכיון ונעילה נשמרים בכל מכשיר בנפרד.</p>
          <button type="button" id="sign-out">התנתקות</button>
        </div>
        <p id="account-status" class="status" aria-live="polite"></p>
        <div class="dialog-actions"><button value="close">סגירה</button></div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <div id="reply-bar" class="reply-bar" hidden>
      <span id="reply-text"></span>
      <button type="button" id="reply-cancel" aria-label="ביטול התגובה">✕</button>
    </div>

    <form id="composer" class="composer">
      <button type="button" id="mode" class="mode-btn" hidden>✉️</button>
      <textarea id="input" rows="1" placeholder="כתבו את המכתב…" maxlength="8000" required></textarea>
      <button type="submit" id="send" class="send" aria-label="שליחה">➤</button>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
