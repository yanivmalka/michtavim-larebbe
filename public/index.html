<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>מכתבים לרבי</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <img src="icon.svg" alt="" class="avatar">
      <div class="title">
        <h1>מכתבים לרבי</h1>
        <span class="sub" id="status">מענה מתוך אגרות הקודש</span>
      </div>
      <label class="lang">
        <span class="sr">שפת המענה</span>
        <select id="lang" aria-label="שפת המענה">
          <option value="">שפת המכתב</option>
          <option value="he">עברית</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
        </select>
      </label>
      <button id="view-fav" class="icon-btn" title="מועדפים" aria-label="מועדפים" aria-pressed="false">☆</button>
      <button id="view-archive" class="icon-btn" title="ארכיון" aria-label="ארכיון" aria-pressed="false">🗄</button>
    </header>

    <div id="update-banner" class="update-banner" hidden>
      <span id="update-text"></span>
      <button type="button" id="update-now">עדכון</button>
    </div>

    <main id="chat" class="chat" aria-live="polite">
    </main>

    <dialog id="settings" class="settings">
      <form method="dialog">
        <h2>הגדרות</h2>
        <label>כתובת השרת
          <input id="server-input" type="url" placeholder="https://example.com" dir="ltr">
        </label>
        <button type="button" id="server-save">שמירה</button>
        <hr>
        <div class="version-row">
          <span>גרסת האפליקציה: <b id="app-version" dir="ltr">–</b></span>
        </div>
        <label class="check"><input type="checkbox" id="auto-check" checked> בדיקת עדכונים אוטומטית בפתיחה</label>
        <button type="button" id="check-update">בדיקת עדכונים</button>
        <p id="update-status" class="status" aria-live="polite"></p>
        <button type="button" id="install-update" hidden>הורדה והתקנה</button>
        <progress id="update-progress" max="100" value="0" hidden></progress>
        <div class="dialog-actions"><button value="close">סגירה</button></div>
      </form>
    </dialog>

    <div id="hl-bar" class="hl-bar" hidden>
      <button type="button" id="hl-add">🖍 הדגשה</button>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button type="button" id="lightbox-close" aria-label="סגירה">✕</button>
      <div class="lightbox-scroll"><img id="lightbox-img" alt=""></div>
    </div>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="כתבו את המכתב…" maxlength="8000" required></textarea>
      <button type="submit" id="send" class="send" aria-label="שליחה">➤</button>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
